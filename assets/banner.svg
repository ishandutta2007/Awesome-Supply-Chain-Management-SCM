<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Flow Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .glow-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .flow-path {
      stroke-dasharray: 12, 12;
      animation: dash 20s linear infinite;
    }
    .flow-path-reverse {
      stroke-dasharray: 8, 8;
      animation: dash-reverse 15s linear infinite;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 0.95; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -240; }
    }
    @keyframes dash-reverse {
      to { stroke-dashoffset: 240; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: url(#text-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .tag-pill {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="900" height="260" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- BACKGROUND DYNAMIC ANIMATED ELEMENTS (Placed behind text) -->
  <!-- Animated Network Connection Lines -->
  <path d="M 50 200 Q 250 230 450 190 T 850 210" fill="none" stroke="url(#line-grad)" stroke-width="3" class="flow-path" />
  <path d="M 80 50 Q 300 20 550 50 T 820 40" fill="none" stroke="url(#line-grad)" stroke-width="2" class="flow-path-reverse" />
  <path d="M 120 180 C 250 120, 350 240, 500 170 S 750 130, 850 170" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3" class="flow-path" />

  <!-- Animated Supply Chain Hub Nodes (Background) -->
  <g class="glow-node" style="transform-origin: 150px 210px;">
    <circle cx="150" cy="210" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <circle cx="150" cy="210" r="6" fill="#38bdf8" />
  </g>

  <g class="glow-node" style="transform-origin: 750px 190px; animation-delay: 1.5s;">
    <circle cx="750" cy="190" r="18" fill="#818cf8" fill-opacity="0.15" />
    <circle cx="750" cy="190" r="7" fill="#818cf8" />
  </g>

  <g class="glow-node" style="transform-origin: 480px 220px; animation-delay: 0.8s;">
    <circle cx="480" cy="220" r="12" fill="#c084fc" fill-opacity="0.15" />
    <circle cx="480" cy="220" r="5" fill="#c084fc" />
  </g>

  <!-- Ambient Subtle Background Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
  </pattern>
  <rect width="900" height="260" rx="16" fill="url(#grid)" />

  <!-- Background Decorative Pill Badges (Positioned away from text) -->
  <g class="floating-card" style="animation-delay: 0s;">
    <rect x="710" y="35" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="780" y="53" text-anchor="middle" class="tag-pill">🚚 Logistics &amp; Fleet</text>
  </g>
  <g class="floating-card" style="animation-delay: 2s;">
    <rect x="550" y="35" width="145" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="622" y="53" text-anchor="middle" class="tag-pill">📦 Inventory &amp; WMS</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Legibility) -->
  <!-- Top Category Tag -->
  <rect x="50" y="40" width="220" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
  <text x="160" y="57" text-anchor="middle" class="badge-text">📊 SCM ECOSYSTEM DIRECTORY</text>

  <!-- Main Title -->
  <text x="50" y="112" class="title-text">Awesome Supply Chain Management</text>

  <!-- Subtitle -->
  <text x="50" y="145" class="subtitle-text">Curated Enterprise SaaS Platforms &amp; Open-Source Logistics &amp; Inventory Systems</text>

  <!-- Feature Tags Row -->
  <g transform="translate(50, 175)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">✓ 10 SaaS Platforms</text>

    <!-- Tag 2 -->
    <rect x="180" y="0" width="175" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="192" y="19" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="bold">⚡ 15 Open-Source Tools</text>

    <!-- Tag 3 -->
    <rect x="370" y="0" width="185" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="382" y="19" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="bold">📈 Pricing &amp; Market Insights</text>
  </g>

</svg>
